name: rapidaid
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter

  # UI & Animations
  google_fonts: ^6.1.0
  lottie: ^2.7.0
  shimmer: ^3.0.0

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  shared_preferences: ^2.2.2

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  socket_io_client: ^2.0.3+1

  # Local Database
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.1

  # Location
  geolocator: ^10.1.0
  permission_handler: ^11.3.0

  # Background Processing
  workmanager:
    git:
      url: https://github.com/fluttercommunity/flutter_workmanager.git
      path: workmanager
      ref: main

  # Utilities
  uuid: ^4.3.3
  intl: ^0.18.1
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^12.0.0

  # External links / dialing
  url_launcher: ^6.3.0

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8 # Code generation
  json_serializable: ^6.7.1 # JSON serialization
  flutter_lints: ^3.0.0 # Linting rules

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
